<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 -10 260 260" fill="none">
	<title>Elmo St. Yard — Tier II Shipyard Stamp</title>
	<defs>
		<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
			<feGaussianBlur stdDeviation="3" result="blur"/>
			<feMerge>
				<feMergeNode in="blur"/>
				<feMergeNode in="SourceGraphic"/>
			</feMerge>
		</filter>
	</defs>

	<!-- Left gantry bracket '[' -->
	<polyline points="92,70 58,70 58,198 92,198" stroke="#040609" stroke-width="6" stroke-linejoin="miter" stroke-linecap="butt"/>

	<!-- Right stencil-notched gantry bracket ']' -->
	<polyline points="168,70 202,70 202,102" stroke="#040609" stroke-width="6" stroke-linejoin="miter" stroke-linecap="butt"/>
	<line x1="202" y1="114" x2="202" y2="154" stroke="#040609" stroke-width="6"/>
	<polyline points="202,166 202,198 168,198" stroke="#040609" stroke-width="6" stroke-linejoin="miter" stroke-linecap="butt"/>

	<!-- Horizontal cradle / chine clamp bars -->
	<line x1="34" y1="134" x2="77" y2="134" stroke="#040609" stroke-width="6"/>
	<line x1="183" y1="134" x2="226" y2="134" stroke="#040609" stroke-width="6"/>

	<!-- Central 45° gimbal diamond, two parallel lines -->
	<polygon points="130,87.3 176.7,134 130,180.7 83.3,134" stroke="#040609" stroke-width="3.7" stroke-linejoin="miter"/>
	<polygon points="130,94.8 169.2,134 130,173.2 90.8,134" stroke="#040609" stroke-width="3.7" stroke-linejoin="miter"/>

	<!-- Warm amber helm core -->
	<rect x="118.5" y="122.5" width="23" height="23" fill="#FF7828" filter="url(#glow)"/>

	<!-- Vertical ship's spar -->
	<line x1="130" y1="97.4" x2="130" y2="70" stroke="#040609" stroke-width="6"/>

	<!-- Seated 45° St. Elmo corona node -->
	<polygon points="130,38 142,50 130,62 118,50" fill="#5CE1FF" filter="url(#glow)"/>
</svg>
