[package]
name = 'testd-gui'
version = '0.1.0-alpha.1'
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
auto-launch = '0.5'
fs2 = { workspace = true }
libc = '0.2'
open = '5'
png = '0.18'
serde = { workspace = true }
serde_json = { workspace = true }
subtle = '2.6'
tao = '0.37.2'
testd-core = { workspace = true }
testd-daemon = { workspace = true }
tokio = { workspace = true }
tray-icon = { version = '0.25.1', default-features = false, features = ['libappindicator'] }
url = '2'

[target.'cfg(target_os = "linux")'.dependencies]
gio = '0.18'
gtk = '0.18'

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
native-dialog = '=0.9.7'

[target.'cfg(target_os = "macos")'.dependencies]
plist = '1'
objc2 = '0.6'
objc2-foundation = { version = '0.3', default-features = false, features = ['NSString', 'NSURL'] }
objc2-app-kit = { version = '0.3', default-features = false, features = ['NSWorkspace', 'NSApplication', 'NSResponder'] }

[target.'cfg(windows)'.dependencies]
webbrowser = '=1.2.7'
winreg = '0.10'

[target.'cfg(windows)'.build-dependencies]
embed-resource = '3.0.12'

[dev-dependencies]
plist = '1'
tempfile = { workspace = true }

[package.metadata.packager]
product-name = 'Testd'
identifier = 'dev.testd.host'
deep-link-protocols = [{ schemes = ['testd'], name = 'dev.testd.host' }]
category = 'DeveloperTool'
description = 'Local dev domain manager'
homepage = 'https://testd.dev'
publisher = 'testd'
authors = ['the testd authors']
icons = [
	'icons/32x32.png',
	'icons/128x128.png',
	'icons/128x128@2x.png',
	'icons/icon.png',
	'icons/icon.icns',
	'icons/icon.ico',
]
resources = [{ src = '../../packaging/macos/PrivacyInfo.xcprivacy', target = 'PrivacyInfo.xcprivacy' }]

[package.metadata.packager.macos]
info-plist-path = 'Info.plist'
signing-identity = '-'

[package.metadata.packager.deb]
desktop-template = '../../packaging/linux/testd.desktop'
depends = [
	'libc6 (>= 2.35)',
	'libgcc-s1',
	'libgtk-3-0 | libgtk-3-0t64',
	'libayatana-appindicator3-1 | libappindicator3-1',
	'libdbus-1-3',
]

[package.metadata.packager.appimage]
# AppIndicator is loaded dynamically, so linuxdeploy cannot discover it through ldd.
libs = ['libayatana-appindicator3.so.1']

[package.metadata.packager.appimage.files]
# linuxdeploy follows the linked GTK libraries; its GTK plugin forces X11 at runtime.
'../../packaging/linux/appimage-host-environment.sh' = 'apprun-hooks/testd-host-environment.sh'

[package.metadata.packager.nsis]
installer-mode = 'currentUser'
installer-icon = 'icons/icon.ico'
# cargo-packager 0.11.8 uses BUNDLEID instead of IDENTIFIER in its scheme description.
preinstall-section = '''
!define BUNDLEID "${IDENTIFIER}"
Section "-Verify testd URL handler"
	ReadRegStr $R0 HKCU "Software\Classes\testd\shell\open\command" ""
	StrCmp $R0 "" testd_url_verified
	StrCmp $R0 "$\"$INSTDIR\${MAINBINARYNAME}.exe$\" $\"%1$\"" testd_url_verified
	MessageBox MB_ICONSTOP "An existing testd URL handler points elsewhere. It was left unchanged."
	Abort
	testd_url_verified:
SectionEnd
'''
