name: Linux native tray dependencies
description: Install the system libraries and bundling tools for the public tray
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        source /etc/os-release
        privilege=()
        if (( EUID != 0 )); then privilege=(sudo); fi
        case "$ID" in
          ubuntu|debian)
            "${privilege[@]}" apt-get update
            "${privilege[@]}" apt-get install -y pkg-config libgtk-3-dev libayatana-appindicator3-dev \
              librsvg2-dev libdbus-1-dev patchelf
            ;;
          fedora)
            "${privilege[@]}" dnf install -y gcc gcc-c++ make pkgconf-pkg-config python3 curl wget file \
              findutils gawk grep sed unzip xz zstd openssl openssl-devel gtk3-devel \
              libappindicator-gtk3-devel librsvg2-devel dbus-devel systemd patchelf
            ;;
          *)
            printf 'Unsupported CI distribution: %s\n' "$ID" >&2
            exit 1
            ;;
        esac
