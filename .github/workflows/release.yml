name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  site:
    uses: ./.github/workflows/site.yml

  bundle:
    name: bundle (${{ matrix.target }})
    needs: [ci, site]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # One ARM baseline: native signoff on 15/26 uses the same macOS 15-built bytes.
          - os: macos-15
            target: aarch64-apple-darwin
            required: true
            cli_only: false
            formats: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            required: false
            cli_only: false
            formats: app,dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            required: true
            cli_only: false
            formats: appimage,deb
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            required: true
            cli_only: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            required: true
            cli_only: false
            formats: nsis
    continue-on-error: ${{ !matrix.required }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: ./.github/actions/linux-dependencies
        if: runner.os == 'Linux' && !matrix.cli_only
      - name: Install musl build dependencies
        if: matrix.cli_only
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tag or workspace candidate version
        id: version
        run: |
          version="$(python -c 'import pathlib, tomllib;
          print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"])')"
          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then version="${GITHUB_REF_NAME#v}"; fi
          python scripts/release.py verify-version "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - id: packager
        if: ${{ !matrix.cli_only }}
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-packager*
          key: cargo-packager-0.11.8-${{ runner.os }}-${{ runner.arch }}
      - if: ${{ !matrix.cli_only && steps.packager.outputs.cache-hit != 'true' }}
        run: cargo install cargo-packager --locked --version 0.11.8
      - run: cargo build --release --bin testd --locked --target ${{ matrix.target }}
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
          # Rust's self-contained musl link avoids musl-gcc's injected dynamic loader.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: '-C target-feature=+crt-static'
          CC_x86_64_unknown_linux_musl: musl-gcc
      - name: Verify the musl CLI is static and runs
        if: matrix.cli_only
        run: |
          binary=target/${{ matrix.target }}/release/testd
          readelf --program-headers "$binary" > musl-program-headers.txt
          readelf --dynamic "$binary" > musl-dynamic.txt
          if grep -E 'INTERP|\(NEEDED\)' musl-program-headers.txt musl-dynamic.txt; then
            printf 'The musl CLI must have no dynamic loader or shared-library dependencies\n' >&2
            exit 1
          fi
          "$binary" --version
          "$binary" --help > /dev/null
      - run: cargo build --release -p testd-gui --locked --target ${{ matrix.target }}
        if: ${{ !matrix.cli_only }}
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
      - name: Package native tray without a webview runtime
        if: ${{ !matrix.cli_only }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: >-
          cargo packager --release --packages testd-gui --target ${{ matrix.target }}
          --formats ${{ matrix.formats }}
          --binaries-dir "${{ github.workspace }}/target/${{ matrix.target }}/release"
          --out-dir "${{ github.workspace }}/target/${{ matrix.target }}/release/bundle"
      - name: Package archives and validate bundle selection without installing
        run: >-
          python scripts/release.py package --version "${{ steps.version.outputs.version }}"
          --target ${{ matrix.target }} --build-dir target/${{ matrix.target }}/release --output dist
          ${{ matrix.cli_only && '--cli-only' || '' }}
      # Installer smoke tests require a separately backed-up, interactive VM.
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  sbom:
    needs: [ci, site]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo install cargo-cyclonedx --locked
      - run: scripts/release-sbom.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: dist/sbom/
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [bundle, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom
      - run: tar -czf dist/testd-sbom.tar.gz -C sbom .
      - name: Generate Homebrew definitions from real release bytes
        run: >-
          python scripts/release.py homebrew --version "${GITHUB_REF_NAME#v}"
          --artifacts dist --output dist
      - name: Generate the pinned CLI installer
        run: python scripts/release.py installer --version "${GITHUB_REF_NAME#v}" --output dist
      - run: python scripts/release.py checksums dist
      - name: Upload artifacts and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release.py release-notes "${GITHUB_REF_NAME#v}" > release-notes.md
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            flags=(--verify-tag --draft --title "$GITHUB_REF_NAME" --notes-file release-notes.md)
            case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
            gh release create "$GITHUB_REF_NAME" "${flags[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*
          gh release edit "$GITHUB_REF_NAME" --draft=false
