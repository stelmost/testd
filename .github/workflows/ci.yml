name: ci

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - '.github/actions/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'deny.toml'
      - 'src/**'
      - 'crates/**'
      - 'assets/brand/testd-slim.svg'
      - 'tests/**'
      - '!tests/check-links.ts'
      - 'scripts/**'
      - 'packaging/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'config.example.toml'
      - 'install.sh'
      - 'package.json'
      - 'bun.lock'
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - '.github/actions/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'deny.toml'
      - 'src/**'
      - 'crates/**'
      - 'assets/brand/testd-slim.svg'
      - 'tests/**'
      - '!tests/check-links.ts'
      - 'scripts/**'
      - 'packaging/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'config.example.toml'
      - 'install.sh'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            required: false
          - os: macos-15
            required: true
          - os: macos-26
            required: true
          - os: macos-15-intel
            required: false
          - os: windows-2025
            required: false
    continue-on-error: ${{ !matrix.required }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: rustup toolchain install 1.90.0 --profile minimal
      - uses: ./.github/actions/linux-dependencies
        if: runner.os == 'Linux'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: oven-sh/setup-bun@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: bun install --frozen-lockfile
      - name: Run all unprivileged platform checks
        run: python tests/run.py ci --report ci-reports --verbose
      - name: Retain status summary, never fixture state or raw reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary-${{ matrix.os }}
          path: ci-reports/ci-summary.json
          retention-days: 7
          if-no-files-found: warn

  # Containers cover userspace, not native kernel, system, or desktop integration.
  linux-userspace:
    name: test (${{ matrix.distro }}-${{ matrix.version }} userspace)
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            version: '13'
            required: true
          - distro: fedora
            version: '44'
            required: false
    continue-on-error: ${{ !matrix.required }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.distro }}:${{ matrix.version }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      HOME: /home/testd-ci
      CARGO_HOME: /home/testd-ci/.cargo
      RUSTUP_HOME: /home/testd-ci/.rustup
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Bootstrap Linux userspace container
        run: |
          source /etc/os-release
          case "$ID" in
            debian)
              apt-get update
              apt-get install -y --no-install-recommends build-essential git tar gzip ca-certificates \
                libstdc++6 passwd util-linux python3 curl unzip xz-utils zstd openssl
              ;;
            fedora)
              dnf install -y git tar gzip ca-certificates libstdc++ shadow-utils util-linux python3 curl
              ;;
            *)
              printf 'Unsupported CI distribution: %s\n' "$ID" >&2
              exit 1
              ;;
          esac
          useradd --create-home testd-ci
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-dependencies
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: rustup toolchain install 1.90.0 --profile minimal
      - uses: oven-sh/setup-bun@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.distro }}-${{ matrix.version }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: bun install --frozen-lockfile
      - name: Run Linux userspace checks as a normal user
        run: |
          chown -R testd-ci:testd-ci "$HOME" "$GITHUB_WORKSPACE"
          runuser -u testd-ci --preserve-environment -- \
            env USER=testd-ci LOGNAME=testd-ci \
            python3 tests/run.py ci --report "$GITHUB_WORKSPACE/ci-reports" --verbose
      - name: Retain status summary, never fixture state or raw reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary-${{ matrix.distro }}-${{ matrix.version }}
          path: ci-reports/ci-summary.json
          retention-days: 7
          if-no-files-found: warn

  system-state-fixtures:
    name: system-state fixtures (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            required: false
          - os: macos-15
            required: true
          - os: macos-26
            required: true
          - os: windows-latest
            required: false
    continue-on-error: ${{ !matrix.required }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Real resolver and trust checks require a separate disposable host with
      # a persisted full-system snapshot; hosted CI only runs fake-state tests.
      - run: python -m unittest discover -s tests/release -p test_release.py -k SystemStateTests
