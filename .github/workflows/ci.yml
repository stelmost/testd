name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Classify the change set so documentation-only edits do not start builds.
  # The filters themselves live in tests/ci-changes.sh.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      release: ${{ steps.filter.outputs.release }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash tests/ci-changes.sh

  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.release == 'true'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            required: false
          - os: macos-15
            required: true
          - os: macos-15-intel
            required: false
          - os: windows-2025
            required: false
    continue-on-error: ${{ !matrix.required }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: rustup toolchain install 1.90.0 --profile minimal
      - uses: ./.github/actions/linux-dependencies
        if: runner.os == 'Linux'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: oven-sh/setup-bun@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: bun install --frozen-lockfile
      - name: Run all unprivileged platform checks
        run: python tests/run.py ci --report ci-reports --verbose
      - name: Retain status summary, never fixture state or raw reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary-${{ matrix.os }}
          path: ci-reports/ci-summary.json
          retention-days: 7
          if-no-files-found: warn

  # Containers cover userspace, not native kernel, system, or desktop integration.
  linux-userspace:
    name: test (${{ matrix.distro }}-${{ matrix.version }} userspace)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            version: '13'
            required: true
          - distro: fedora
            version: '44'
            required: false
    continue-on-error: ${{ !matrix.required }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.distro }}:${{ matrix.version }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      HOME: /home/testd-ci
      CARGO_HOME: /home/testd-ci/.cargo
      RUSTUP_HOME: /home/testd-ci/.rustup
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Bootstrap Linux userspace container
        run: |
          source /etc/os-release
          case "$ID" in
            debian)
              apt-get update
              apt-get install -y --no-install-recommends build-essential git tar gzip ca-certificates \
                libstdc++6 passwd util-linux python3 curl unzip xz-utils zstd openssl
              ;;
            fedora)
              dnf install -y git tar gzip ca-certificates libstdc++ shadow-utils util-linux python3 curl
              ;;
            *)
              printf 'Unsupported CI distribution: %s\n' "$ID" >&2
              exit 1
              ;;
          esac
          useradd --create-home testd-ci
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-dependencies
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: rustup toolchain install 1.90.0 --profile minimal
      - uses: oven-sh/setup-bun@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.distro }}-${{ matrix.version }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: bun install --frozen-lockfile
      - name: Run Linux userspace checks as a normal user
        run: |
          chown -R testd-ci:testd-ci "$HOME" "$GITHUB_WORKSPACE"
          runuser -u testd-ci --preserve-environment -- \
            env USER=testd-ci LOGNAME=testd-ci \
            python3 tests/run.py ci --report "$GITHUB_WORKSPACE/ci-reports" --verbose
      - name: Retain status summary, never fixture state or raw reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary-${{ matrix.distro }}-${{ matrix.version }}
          path: ci-reports/ci-summary.json
          retention-days: 7
          if-no-files-found: warn

  site:
    name: site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Run isolated website checks once
        run: python3 tests/run.py site --report ci-reports --verbose

  system-state-fixtures:
    name: system-state fixtures (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            required: false
          - os: macos-15
            required: true
          - os: windows-latest
            required: false
    continue-on-error: ${{ !matrix.required }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Real resolver and trust checks require a separate disposable host with
      # a persisted full-system snapshot; hosted CI only runs fake-state tests.
      - run: python -m unittest discover -s tests/release -p test_release.py -k SystemStateTests

  bundle:
    name: bundle (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [test, linux-userspace, system-state-fixtures, site]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            required: true
            formats: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            required: false
            formats: app,dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            required: true
            formats: appimage,deb
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            required: true
            formats: nsis
    continue-on-error: ${{ !matrix.required }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: ./.github/actions/linux-dependencies
        if: runner.os == 'Linux'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tag or workspace candidate version
        id: version
        run: |
          version="$(python -c 'import pathlib, tomllib;
          print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"])')"
          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then version="${GITHUB_REF_NAME#v}"; fi
          python scripts/release.py verify-version "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - id: packager
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-packager*
          key: cargo-packager-0.11.8-${{ runner.os }}-${{ runner.arch }}
      - if: steps.packager.outputs.cache-hit != 'true'
        run: cargo install cargo-packager --locked --version 0.11.8
      - run: cargo build --release --bin testd --locked --target ${{ matrix.target }}
      - run: cargo build --release -p testd-gui --locked --target ${{ matrix.target }}
      - name: Package native tray without a webview runtime
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: >-
          cargo packager --release --packages testd-gui --target ${{ matrix.target }}
          --formats ${{ matrix.formats }}
          --binaries-dir "${{ github.workspace }}/target/${{ matrix.target }}/release"
          --out-dir "${{ github.workspace }}/target/${{ matrix.target }}/release/bundle"
      - name: Package archives and validate bundle selection without installing
        run: >-
          python scripts/release.py package --version "${{ steps.version.outputs.version }}"
          --target ${{ matrix.target }} --build-dir target/${{ matrix.target }}/release --output dist
      # Installer smoke tests require a separately backed-up, interactive VM.
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  sbom:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [test, linux-userspace, system-state-fixtures, site]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo install cargo-cyclonedx --locked
      - run: scripts/release-sbom.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: dist/sbom/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [bundle, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom
      - run: tar -czf dist/testd-sbom.tar.gz -C sbom .
      - name: Generate Homebrew definitions from real release bytes
        run: >-
          python scripts/release.py homebrew --version "${GITHUB_REF_NAME#v}"
          --artifacts dist --output dist
      - run: python scripts/release.py checksums dist
      - name: Attach free artifacts to a draft public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release.py release-notes "${GITHUB_REF_NAME#v}" > release-notes.md
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            flags=(--verify-tag --draft --title "$GITHUB_REF_NAME" --notes-file release-notes.md)
            case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
            gh release create "$GITHUB_REF_NAME" "${flags[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*
